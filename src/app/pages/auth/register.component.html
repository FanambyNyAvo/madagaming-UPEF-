<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-logo" routerLink="/">🎮 MadaGaming</div>
    <h1 class="auth-title">Créer un compte</h1>
    <p class="auth-sub">Rejoignez la communauté MadaGaming 🇲🇬</p>

    @if (error()) {
      <div class="auth-error">⚠ {{ error() }}</div>
    }

    <div class="form-row">
      <div class="form-group">
        <label>Prénom *</label>
        <input type="text" [ngModel]="firstName()" (ngModelChange)="firstName.set($event)"
               placeholder="Jean" />
      </div>
      <div class="form-group">
        <label>Nom *</label>
        <input type="text" [ngModel]="lastName()" (ngModelChange)="lastName.set($event)"
               placeholder="Rakoto" />
      </div>
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
             placeholder="jean@example.com" />
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" [ngModel]="phone()" (ngModelChange)="phone.set($event)"
             placeholder="+261 34 00 000 00" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Mot de passe *</label>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
               placeholder="Min. 6 caractères" />
      </div>
      <div class="form-group">
        <label>Confirmer *</label>
        <input type="password" [ngModel]="confirm()" (ngModelChange)="confirm.set($event)"
               placeholder="••••••••" />
      </div>
    </div>

    <button class="auth-btn" (click)="onSubmit()" [disabled]="loading()">
      {{ loading() ? 'Création...' : 'Créer mon compte' }}
    </button>

    <p class="auth-footer">
      Déjà un compte ?
      <a routerLink="/auth/login">Se connecter</a>
    </p>
  </div>
</div>
