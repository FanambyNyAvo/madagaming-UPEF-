<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo" routerLink="/">🎮 MadaGaming</div>
    <h1 class="auth-title">Connexion</h1>
    <p class="auth-sub">Bon retour parmi nous !</p>

    @if (error()) {
      <div class="auth-error">⚠ {{ error() }}</div>
    }

    <div class="form-group">
      <label>Email</label>
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
             placeholder="jean@example.com" />
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
             placeholder="••••••••" />
    </div>

    <button class="auth-btn" (click)="onSubmit()" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>

    <p class="auth-footer">
      Pas encore de compte ?
      <a routerLink="/auth/register">S'inscrire gratuitement</a>
    </p>
  </div>
</div>
